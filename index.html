<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billboard Map · Saint Paul Agency</title>
<meta name="description" content="Interactive map of digital billboard locations, prepared by Saint Paul Agency.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/spa-logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
@font-face { font-family: Poppins; font-weight: 400; font-display: swap; src: url(assets/fonts/poppins-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 500; font-display: swap; src: url(assets/fonts/poppins-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 600; font-display: swap; src: url(assets/fonts/poppins-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 700; font-display: swap; src: url(assets/fonts/poppins-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 800; font-display: swap; src: url(assets/fonts/poppins-latin-800-normal.woff2) format('woff2'); }
:root {
  --navy: #0E1830; --royal: #233975; --pin: #1F6FD8; --sky: #5EA6F3;
  --ink: #0E1830; --ink-2: #0E1830; --muted: #0E1830; --line: #D8DFEB; --card: #FFFFFF; --card-2: #F2F5FA;
  --shadow: 0 2px 4px rgba(14, 24, 48, .08), 0 12px 32px rgba(14, 24, 48, .18);
  --font: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
  --pin-scale: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #E8EDF4; color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
#map { position: fixed; inset: 0; z-index: 0; background: #E8EDF4; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--royal); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* ---------- branded panel ---------- */
.panel { position: absolute; z-index: 500; top: 16px; left: 16px; width: 380px; max-height: calc(100% - 32px); overflow: auto; overscroll-behavior: contain;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow); border-left: 6px solid var(--royal); }
.p-head { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; padding: 18px 16px 14px 16px; border-bottom: 1px solid var(--line); }
.p-head img { width: 140px; height: auto; aspect-ratio: 240 / 228; flex: none; }
.p-eyebrow { font-size: 17px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--royal); line-height: 1.3; }
.p-title { margin: 2px 0 0 0; font-size: 27px; font-weight: 700; line-height: 1.15; color: var(--navy); }
.p-sub { font-size: 15.5px; font-weight: 500; color: var(--ink-2); line-height: 1.4; margin-top: 4px; }
.p-toggle { display: none; margin-left: auto; flex: none; border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 7px 12px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.p-body { padding: 16px 18px 16px 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 14px; }
.stat { padding: 0 10px; border-left: 1px solid var(--line); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat b { display: block; font-size: 31px; line-height: 1.1; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b small { font-size: 15px; font-weight: 700; color: var(--muted); }
.stat span { display: block; font-size: 14px; font-weight: 500; color: var(--ink-2); line-height: 1.3; margin-top: 2px; }
.label { font-size: 13.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px 0; }
.btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--royal); background: var(--royal); color: #fff;
  border-radius: 12px; padding: 10px 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 14px; }
.btn:hover { background: #1B2D5E; }
.btn svg { width: 17px; height: 17px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--card-2); gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 7px 6px; font-size: 14.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg button small { font-weight: 600; color: var(--muted); }
.seg button:hover { background: #E4EAF3; }
.seg button.on { background: var(--royal); color: #fff; }
.seg button.on small { color: #fff; }
.views { margin-bottom: 12px; }
.search { position: relative; margin-bottom: 12px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 37px; font-size: 16px; font-weight: 500; background: var(--card); }
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input:focus { outline: 2px solid var(--sky); outline-offset: 1px; }
.hint { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-top: 5px; }
.hint:empty { display: none; }
.ops-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 4px 0; }
.ops-head .label { margin: 0; }
.link { border: 0; background: none; padding: 2px 4px; font-size: 14px; font-weight: 700; color: var(--royal); cursor: pointer; border-radius: 6px; }
.link[hidden] { display: none; }
.ops { display: grid; grid-template-columns: 1fr; gap: 1px; margin-bottom: 10px; }
.op { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 9px; padding: 5px 6px; cursor: pointer; text-align: left; width: 100%; font-size: 16px; min-width: 0; }
.op:hover { background: var(--card-2); }
.op .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--c, var(--pin)); background: var(--c, var(--pin)); flex: none; position: relative; }
.op .box::after { content: ""; position: absolute; left: 4px; top: 0; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.op.off .box { background: #fff; border-color: var(--navy); }
.op.off .box::after { display: none; }
.op.off .name { text-decoration: line-through; text-decoration-thickness: 2px; }
.op .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op .short { display: none; }
.op .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.row .label { margin: 0; flex: none; }
.row .seg { flex: 0 1 220px; }
.p-foot { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.p-foot a { font-weight: 700; text-decoration: none; white-space: nowrap; }
.p-foot .src { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }

/* ---------- pins ---------- */
.pin { position: relative; width: 26px; height: 36px; cursor: pointer; transform: scale(var(--pin-scale)); transform-origin: 50% 100%; transition: transform .15s; }
.pin svg { display: block; filter: drop-shadow(0 1px 1.5px rgba(14, 24, 48, .45)); }
.pin .cnt { position: absolute; top: -6px; right: -8px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--navy); color: #fff;
  font: 700 11px/17px var(--font); text-align: center; border: 1.5px solid #fff; }
.pin.hl svg path { fill: #E8590C; stroke: #9A3608; }
.pin:hover, .pin:focus-visible, .pin.sel { transform: scale(calc(var(--pin-scale) * 1.18)); }
.pin:hover svg, .pin:focus-visible svg, .pin.sel svg { filter: brightness(1.1) drop-shadow(0 2px 4px rgba(14, 24, 48, .55)); }
.pin:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }
.maplibregl-marker:has(.pin:hover), .maplibregl-marker:has(.pin.sel) { z-index: 3; }
.tip { position: absolute; z-index: 400; pointer-events: none; background: var(--navy); color: #fff; font-size: 15px; font-weight: 600; line-height: 1.35; padding: 6px 11px;
  border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); box-shadow: 0 4px 12px rgba(14, 24, 48, .25); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip b { font-weight: 700; }

/* ---------- popups ---------- */
.maplibregl-popup-content { border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; font-family: var(--font); font-size: 15.5px; line-height: 1.45; color: var(--ink); min-width: 290px; }
.maplibregl-popup-close-button { font-size: 22px; width: 32px; height: 32px; color: var(--ink-2); border-radius: 0 14px 0 8px; }
.maplibregl-popup-close-button:hover { background: var(--card-2); }
.pp-head { font-size: 13.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--royal); margin: 0 26px 6px 0; }
.pp-list { max-height: 270px; overflow: auto; }
.pp-board + .pp-board { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.pp-op { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--navy); margin-right: 26px; }
.pp-op i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pp-where { color: var(--ink); font-weight: 500; }
.pp-meta { font-size: 14px; font-weight: 500; color: var(--ink-2); }
.pp-btns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.pp-btns a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14.5px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--royal); color: var(--royal); }
.pp-btns a.sv { background: var(--royal); color: #fff; }
.pp-btns a:hover { filter: brightness(1.12); }
.pp-btns svg { width: 16px; height: 16px; }
.maplibregl-map { font-family: var(--font); }
.maplibregl-ctrl-attrib { font-size: 11px; }
.maplibregl-ctrl-group button { width: 34px; height: 34px; }

/* ---------- loading / offline ---------- */
.status { position: absolute; z-index: 450; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--navy); color: #fff; font-size: 15px; font-weight: 600;
  padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.status[hidden] { display: none; }

/* ---------- presenting ---------- */
.badge { display: none; position: absolute; z-index: 500; top: 16px; left: 16px; align-items: center; gap: 14px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  border-left: 6px solid var(--royal); padding: 10px 14px 10px 14px; max-width: calc(100% - 100px); }
.badge img { width: 88px; height: auto; aspect-ratio: 240 / 228; flex: none; }
.badge .b-eyebrow { font-size: 14.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--royal); }
.badge .b-title { font-size: 25px; font-weight: 700; color: var(--navy); line-height: 1.2; white-space: nowrap; }
.badge .b-sub { font-size: 15.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.b-views { display: flex; gap: 6px; margin-left: 8px; }
.b-views button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.b-views button.on { background: var(--royal); border-color: var(--royal); color: #fff; }
.badge .exit { margin-left: 4px; border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 7px 14px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.legend { display: none; position: absolute; z-index: 500; left: 16px; bottom: 34px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 16px; font-size: 15.5px; font-weight: 600; }
.legend div { display: flex; align-items: center; gap: 8px; line-height: 1.75; }
.legend i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
body.present .panel { display: none; }
body.present .badge { display: flex; }
body.present.by-ops .legend { display: block; }

/* ---------- shorter laptop screens: keep the whole panel in view ---------- */
@media (min-width: 641px) and (max-height: 980px) {
  .p-head { padding: 14px 16px 10px 16px; gap: 6px; }
  .p-head img { width: 124px; }
  .p-body { padding: 10px 14px 12px 14px; }
  .stats { margin-bottom: 10px; }
  .stat b { font-size: 27px; }
  .stats { grid-template-columns: 1.4fr 1fr 1fr; }
  .stat span { font-size: 13.5px; }
  .btn { padding: 8px 12px; margin-bottom: 10px; font-size: 15px; }
  .views, .search { margin-bottom: 9px; }
  .search input { padding-top: 7px; padding-bottom: 7px; }
  .search svg { top: 9px; }
  .ops { grid-template-columns: 1fr 1fr; column-gap: 4px; margin-bottom: 8px; }
  .op .full { display: none; }
  .op .short { display: inline; }
  .op { font-size: 15px; gap: 8px; padding: 3px 5px; }
  .op .box { width: 18px; height: 18px; }
  .op .box::after { left: 4px; top: 0; width: 5px; height: 9.5px; }
  .p-foot { margin-top: 8px; padding-top: 8px; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rows .row { margin: 0; }
  .rows .label { display: none; }
  .rows .seg { flex: 1; }
  .rows .seg button { font-size: 13.5px; padding: 6px 4px; }
  .p-foot { font-size: 13.5px; line-height: 1.45; }
}

/* ---------- phones ---------- */
@media (max-width: 640px) {
  .panel { top: 10px; left: 10px; right: 10px; width: auto; max-height: calc(100% - 20px); border-left-width: 5px; }
  .p-head { flex-direction: row; text-align: left; padding: 10px 12px; gap: 10px; border-bottom: 0; }
  .p-head img { width: 64px; }
  .p-title { font-size: 20px; }
  .p-eyebrow { font-size: 14px; letter-spacing: .05em; }
  .p-toggle { display: block; }
  .panel:not(.collapsed) .p-head { border-bottom: 1px solid var(--line); }
  .panel.collapsed .p-body, .panel.collapsed .p-sub { display: none; }
  .p-body { padding: 12px; }
  .stat b { font-size: 25px; }
  .tip { display: none; }
  .badge { top: 10px; left: 10px; gap: 10px; padding: 8px 10px; }
  .badge .b-title { font-size: 18px; }
  .badge img { width: 56px; }
  .badge .b-sub { font-size: 13.5px; }
  .legend { left: 10px; bottom: 30px; }
}
/* ---------- short laptop screens: logo beside the title ---------- */
@media (min-width: 641px) and (max-height: 760px) {
  .p-head { flex-direction: row; text-align: left; padding: 10px 14px 9px 14px; gap: 12px; }
  .p-head img { width: 98px; }
  .p-title { font-size: 23px; text-wrap: balance; }
  .p-eyebrow { font-size: 15px; letter-spacing: .05em; }
  .p-sub { font-size: 14px; margin-top: 2px; }
}
@media (max-width: 980px) { .b-views { display: none; } }
@media print { .p-toggle, .maplibregl-ctrl-top-right, .badge .exit { display: none; } }
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of billboard locations"></div>

<aside class="panel" id="panel" aria-label="Saint Paul Agency billboard map">
  <div class="p-head">
    <img src="assets/img/spa-logo.png" alt="Saint Paul Agency logo">
    <div>
      <div class="p-eyebrow">Saint Paul Agency</div>
      <h1 class="p-title">Digital Billboard Map</h1>
      <div class="p-sub" id="subtitle"></div>
    </div>
    <button class="p-toggle" id="toggle" type="button" aria-expanded="true" aria-controls="pbody">Hide</button>
  </div>
  <div class="p-body" id="pbody">
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="sBoards">0</b><span id="sBoardsL">digital billboards</span></div>
      <div class="stat"><b id="sSpots">0</b><span>locations</span></div>
      <div class="stat"><b id="sOps">0</b><span>companies</span></div>
    </div>
    <button class="btn" id="present" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Present full screen</button>
    <div class="seg views" id="views" role="group" aria-label="Show"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search a city, road or board ID" aria-label="Search a city, road or board ID" autocomplete="off">
      <div class="hint" id="hint" aria-live="polite"></div>
    </div>
    <div class="ops-head"><p class="label">Billboard companies</p><button class="link" id="opsAll" type="button" hidden>Show all</button></div>
    <div class="ops" id="ops"></div>
    <div class="rows">
    <div class="row"><p class="label">Pins</p><div class="seg" id="colorMode" role="group" aria-label="Pin color"><button type="button" data-c="one">One color</button><button type="button" data-c="ops">By company</button></div></div>
    <div class="row"><p class="label">Map</p><div class="seg" id="mapStyle" role="group" aria-label="Map style"><button type="button" data-m="streets">Streets</button><button type="button" data-m="light">Light</button></div></div>
    </div>
    <div class="p-foot"><span class="src" id="src"></span>
      <a href="https://saintpaulagency.com" target="_blank" rel="noopener">saintpaulagency.com</a> · <a href="tel:+16125998422">(612) 599-8422</a></div>
  </div>
</aside>

<div class="badge" id="badge" aria-label="Saint Paul Agency billboard map">
  <img src="assets/img/spa-logo.png" alt="Saint Paul Agency logo">
  <div><div class="b-eyebrow">Saint Paul Agency</div><div class="b-title">Digital Billboard Map</div><div class="b-sub" id="bSub"></div></div>
  <div class="b-views" id="bViews" role="group" aria-label="Show"></div>
  <button class="exit" id="exit" type="button">Exit</button>
</div>
<div class="legend" id="legend" aria-label="Billboard companies"></div>
<div class="tip" id="tip" role="presentation"></div>
<div class="status" id="status" role="status">Loading the map…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="data/boards.js"></script>
<script>
(function () {
  const statusEl = document.getElementById('status');
  if (!window.maplibregl || !window.BOARDS) {
    statusEl.textContent = 'The map couldn’t load. Check the internet connection and reload, or use the backup PDF.';
    return;
  }
  const DATA = window.BOARDS, ALL = DATA.boards;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => n.toLocaleString('en-US');
  const narrow = () => window.matchMedia('(max-width: 640px)').matches;
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  // One pin per spot: boards on the same pole share a pin and are listed together.
  const spots = [], byKey = {};
  ALL.forEach(b => { const k = b.lat.toFixed(5) + ',' + b.lon.toFixed(5); if (!byKey[k]) { byKey[k] = { lat: b.lat, lon: b.lon, boards: [] }; spots.push(byKey[k]); } byKey[k].boards.push(b); });
  const opCount = {}; ALL.forEach(b => { opCount[b.operator] = (opCount[b.operator] || 0) + 1; });
  const OPS = Object.keys(opCount).sort((a, b) => opCount[b] - opCount[a] || a.localeCompare(b));
  const opOn = new Set(OPS);

  document.getElementById('subtitle').textContent = DATA.title.replace(/^Digital billboard inventory\s*·?\s*/i, '') || DATA.title;
  const built = DATA.built ? new Date(DATA.built + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  document.getElementById('src').textContent = `Board list: Basis${built ? ', ' + built : ''}` + (DATA.repeats ? ` · ${DATA.repeats} boards listed twice are shown once` : '');

  // ---------- map ----------
  const STYLES = { streets: 'https://tiles.openfreemap.org/styles/liberty', light: 'https://tiles.openfreemap.org/styles/positron' };
  let mapStyle = store.get('spaMapStyle') === 'light' ? 'light' : 'streets';
  const map = new maplibregl.Map({
    container: 'map', style: STYLES[mapStyle],
    bounds: [[-93.9, 44.7], [-92.7, 45.3]], dragRotate: false, pitchWithRotate: false, attributionControl: { compact: false },
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');
  let loaded = false;
  map.on('load', () => { loaded = true; statusEl.hidden = true; });
  map.on('error', () => { if (!loaded) statusEl.textContent = 'The map is having trouble loading. Check the internet connection, or use the backup PDF.'; });
  setTimeout(() => { if (!loaded) statusEl.textContent = 'The map is slow to load. Check the internet connection, or use the backup PDF.'; }, 12000);

  // Pins shrink a little when zoomed out so busy areas stay readable.
  const pinScale = z => z < 8.5 ? 0.72 : z < 9.6 ? 0.82 : z < 11 ? 0.92 : 1;
  const applyScale = () => map.getContainer().style.setProperty('--pin-scale', pinScale(map.getZoom()));
  map.on('zoom', applyScale); applyScale();

  // Pin colors: SPA blue, or one color per company (the biggest companies get the first colors).
  const BLUE = ['#1F6FD8', '#123F86'];
  const PALETTE = [['#1F6FD8', '#123F86'], ['#D9480F', '#8A2E09'], ['#2B8A3E', '#1A5426'], ['#862E9C', '#521C5F'], ['#C2255C', '#7A1739'], ['#0B7285', '#074652'], ['#5C677D', '#363D4A'], ['#B08900', '#6B5300']];
  const opColor = {}; OPS.forEach((o, i) => { opColor[o] = PALETTE[i % PALETTE.length]; });
  let colorMode = store.get('spaMapColor') === 'ops' ? 'ops' : 'one';
  const pinSvg = c => `<svg width="26" height="36" viewBox="0 0 26 36" aria-hidden="true"><path d="M13 1C6.4 1 1 6.3 1 12.9 1 21.8 13 35 13 35s12-13.2 12-22.1C25 6.3 19.6 1 13 1z" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.5"/><circle cx="13" cy="13" r="4.6" fill="#fff"/></svg>`;
  const sv = (lat, lon) => `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`;
  const gm = (lat, lon) => `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  const icoEye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg>';

  let query = '';
  const matchQ = b => !query || [b.operator, b.where, b.city, b.code, b.id, b.zip].join(' ').toLowerCase().includes(query);
  const shown = s => s.boards.filter(b => opOn.has(b.operator) && matchQ(b));

  function popupHtml(s) {
    const list = shown(s), dot = o => colorMode === 'ops' ? `<i style="background:${opColor[o][0]}"></i>` : '';
    const head = list.length > 1 ? `<div class="pp-head">${list.length} boards at this spot</div>` : '';
    return head + '<div class="pp-list">' + list.map(b => `<div class="pp-board"><div class="pp-op">${dot(b.operator)}${esc(b.operator)}</div>` +
      `<div class="pp-where">${esc(b.where || 'Location not listed')}</div>` +
      `<div class="pp-meta">${esc(b.city)}${b.zip ? ' ' + esc(b.zip) : ''}${b.code ? ' · Board ' + esc(b.code) : ''}</div></div>`).join('') + '</div>' +
      `<div class="pp-btns"><a class="sv" href="${sv(s.lat, s.lon)}" target="_blank" rel="noopener">${icoEye}Open Street View</a><a href="${gm(s.lat, s.lon)}" target="_blank" rel="noopener">Google Maps</a></div>` +
      `<div class="pp-meta" style="margin-top:7px">${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}</div>`;
  }
  const popup = new maplibregl.Popup({ offset: [0, -34], maxWidth: '340px', focusAfterOpen: false });
  let selected = null;
  popup.on('close', () => { if (selected) selected.el.classList.remove('sel'); selected = null; });
  function openSpot(s) {
    hideTip();
    // keep the popup clear of the panel and the screen edges: slide the map first when the pin sits too close
    const pt = map.project([s.lon, s.lat]), W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
    const left = narrow() || presenting() ? 180 : 610, top = narrow() ? 420 : 390;
    if (pt.x < left || pt.x > W - 190 || pt.y < top || pt.y > H - 30) {
      const target = narrow() ? [W / 2, H - 70] : [Math.max(left, W * 0.6), H * 0.75];
      map.easeTo({ center: [s.lon, s.lat], offset: [target[0] - W / 2, target[1] - H / 2], duration: 350 });
    }
    if (selected) selected.el.classList.remove('sel');
    selected = s; s.el.classList.add('sel');
    popup.setLngLat([s.lon, s.lat]).setHTML(popupHtml(s)).addTo(map);
  }

  // quick hover label (the full details stay in the popup)
  const tip = document.getElementById('tip');
  function showTip(s) {
    if (narrow() || selected === s) return;
    const l = shown(s); if (!l.length) return;
    tip.innerHTML = l.length > 1 ? `<b>${l.length} boards</b> · ${esc(s.boards[0].city)}` : `<b>${esc(l[0].operator)}</b> · ${esc(l[0].city)}`;
    const r = s.el.getBoundingClientRect();
    tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = r.top + 'px'; tip.classList.add('on');
  }
  function hideTip() { tip.classList.remove('on'); }
  map.on('movestart', hideTip);

  spots.forEach(s => {
    const el = document.createElement('div');            // MapLibre owns this element's classes and position
    const pin = document.createElement('div'); pin.className = 'pin'; pin.tabIndex = 0; pin.setAttribute('role', 'button');
    el.appendChild(pin); s.el = pin;
    pin.addEventListener('click', e => { e.stopPropagation(); openSpot(s); });
    pin.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSpot(s); } });
    pin.addEventListener('mouseenter', () => showTip(s));
    pin.addEventListener('mouseleave', hideTip);
    pin.addEventListener('focus', () => showTip(s));
    pin.addEventListener('blur', hideTip);
    s.marker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([s.lon, s.lat]);
  });

  const filtered = () => !!query || opOn.size < OPS.length;
  function refresh() {
    let nb = 0, ns = 0; const seenOps = new Set();
    spots.forEach(s => {
      const l = shown(s);
      if (!l.length) { s.marker.remove(); return; }
      nb += l.length; ns++; l.forEach(b => seenOps.add(b.operator));
      const byOps = colorMode === 'ops';
      s.el.className = 'pin' + (query && !byOps ? ' hl' : '') + (selected === s ? ' sel' : '');
      s.el.innerHTML = pinSvg(byOps ? opColor[l[0].operator] : BLUE) + (l.length > 1 ? `<span class="cnt">${l.length}</span>` : '');
      s.el.setAttribute('aria-label', l.length > 1 ? `${l.length} boards in ${s.boards[0].city}` : `${l[0].operator} board in ${l[0].city}`);
      s.marker.addTo(map);
    });
    // the numbers follow the filters
    document.getElementById('sBoards').innerHTML = filtered() ? `${fmt(nb)}<small> / ${fmt(ALL.length)}</small>` : fmt(ALL.length);
    document.getElementById('sBoardsL').textContent = filtered() ? 'boards shown' : 'digital billboards';
    document.getElementById('sSpots').textContent = fmt(filtered() ? ns : spots.length);
    document.getElementById('sOps').textContent = fmt(filtered() ? seenOps.size : OPS.length);
    document.getElementById('bSub').textContent = `${fmt(nb)} digital billboards · ${fmt(ns)} locations`;
    document.getElementById('hint').textContent = query ? (nb ? `${fmt(nb)} board${nb === 1 ? '' : 's'} match · press Enter to zoom to them` : 'No boards match') : '';
    document.getElementById('opsAll').hidden = opOn.size === OPS.length;
  }

  // ---------- views: the sheet's areas plus everything ----------
  const VIEWS = (DATA.views || []).concat([{ key: 'all', label: 'All boards', short: 'All', count: ALL.length }]);
  const inView = (v, b) => !v.box || (b.lat >= v.box[0] && b.lat <= v.box[2] && b.lon >= v.box[1] && b.lon <= v.box[3]);
  const presenting = () => document.body.classList.contains('present');
  function pad() {
    if (presenting()) return narrow() ? { top: 120, bottom: 40, left: 24, right: 24 } : { top: 160, bottom: 50, left: 60, right: 70 };
    const pw = document.getElementById('panel').offsetWidth;
    return narrow() ? { top: document.getElementById('panel').offsetHeight + 40, bottom: 40, left: 24, right: 24 } : { top: 60, bottom: 50, left: pw + 70, right: 70 };
  }
  function fitTo(list, instant) {
    if (!list.length) return;
    const lons = list.map(b => b.lon), lats = list.map(b => b.lat);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: pad(), maxZoom: 15, duration: instant ? 0 : 900 });
  }
  let current = VIEWS[0].key;
  function setView(key, quiet) {
    const v = VIEWS.find(x => x.key === key) || VIEWS[0]; current = v.key; popup.remove();
    document.querySelectorAll('#views button, #bViews button').forEach(b => { const on = b.dataset.k === v.key; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    fitTo(ALL.filter(b => inView(v, b)), quiet);
    if (!quiet) history.replaceState(null, '', '#' + v.key);
  }
  document.getElementById('views').innerHTML = VIEWS.map(v => `<button type="button" data-k="${v.key}" aria-pressed="false">${esc(v.short || v.label)} <small>${fmt(v.count)}</small></button>`).join('');
  document.getElementById('bViews').innerHTML = VIEWS.map(v => `<button type="button" data-k="${v.key}" aria-pressed="false">${esc(v.label)}</button>`).join('');
  ['views', 'bViews'].forEach(id => document.getElementById(id).addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) setView(b.dataset.k); }));

  // ---------- companies, pin colors, map style ----------
  const opsEl = document.getElementById('ops');
  // short names for the two-column list on shorter screens ("Clear Channel Outdoor" -> "Clear Channel")
  const shortName = o => { let t = o, prev; do { prev = t; t = t.replace(/\s+(Outdoor|Media|US|USA|Billboards?|Advertising|Inc\.?|LLC|Co\.?)$/i, ''); } while (t !== prev && t.length > 3); return t || o; };
  opsEl.innerHTML = OPS.map(o => `<button type="button" class="op" data-o="${esc(o)}" aria-pressed="true" title="${esc(o)}"><span class="box" data-c="${opColor[o][0]}"></span><span class="name"><span class="full">${esc(o)}</span><span class="short">${esc(shortName(o))}</span></span><span class="n">${fmt(opCount[o])}</span></button>`).join('');
  const legendEl = document.getElementById('legend');
  function paintControls() {
    const byOps = colorMode === 'ops';
    document.body.classList.toggle('by-ops', byOps);
    document.querySelectorAll('#colorMode button').forEach(b => { const on = b.dataset.c === colorMode; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    document.querySelectorAll('#mapStyle button').forEach(b => { const on = b.dataset.m === mapStyle; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    opsEl.querySelectorAll('.op').forEach(x => { const on = opOn.has(x.dataset.o); x.classList.toggle('off', !on); x.setAttribute('aria-pressed', on); });
    opsEl.querySelectorAll('.box').forEach(x => { if (byOps) x.style.setProperty('--c', x.dataset.c); else x.style.removeProperty('--c'); });
    legendEl.innerHTML = OPS.filter(o => opOn.has(o)).map(o => `<div><i style="background:${opColor[o][0]}"></i>${esc(o)}</div>`).join('');
  }
  document.getElementById('colorMode').addEventListener('click', e => {
    const b = e.target.closest('button[data-c]'); if (!b) return;
    colorMode = b.dataset.c; store.set('spaMapColor', colorMode);
    if (selected) popup.setHTML(popupHtml(selected));
    paintControls(); refresh();
  });
  document.getElementById('mapStyle').addEventListener('click', e => {
    const b = e.target.closest('button[data-m]'); if (!b || b.dataset.m === mapStyle) return;
    mapStyle = b.dataset.m; store.set('spaMapStyle', mapStyle);
    map.setStyle(STYLES[mapStyle]); paintControls();
  });
  opsEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-o]'); if (!b) return;
    const o = b.dataset.o;
    if (opOn.has(o)) opOn.delete(o); else opOn.add(o);
    if (!opOn.size) OPS.forEach(x => opOn.add(x));            // never leave the map empty
    popup.remove(); paintControls(); refresh();
  });
  document.getElementById('opsAll').addEventListener('click', () => { OPS.forEach(x => opOn.add(x)); popup.remove(); paintControls(); refresh(); });

  // ---------- presenting: full screen, panel replaced by a small SPA badge (and the company key when pins are colored by company) ----------
  function setPresent(on) {
    if (on === presenting()) return;
    document.body.classList.toggle('present', on); popup.remove(); hideTip();
    const el = document.documentElement;
    if (on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    setTimeout(() => { map.resize(); setView(current, true); }, 250);
  }
  document.getElementById('present').addEventListener('click', () => setPresent(true));
  document.getElementById('exit').addEventListener('click', () => setPresent(false));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && presenting()) setPresent(false); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (popup.isOpen()) { popup.remove(); return; }
    if (presenting() && !document.fullscreenElement) setPresent(false);
  });

  // ---------- search ----------
  const q = document.getElementById('q');
  q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); popup.remove(); refresh(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const l = ALL.filter(b => opOn.has(b.operator) && matchQ(b)); fitTo(l); if (narrow()) togglePanel(false); }
    if (e.key === 'Escape') { e.stopPropagation(); q.value = ''; query = ''; refresh(); }
  });

  // ---------- phone: fold the panel away ----------
  const panel = document.getElementById('panel'), tg = document.getElementById('toggle');
  function togglePanel(open) { panel.classList.toggle('collapsed', !open); tg.textContent = open ? 'Hide' : 'Show'; tg.setAttribute('aria-expanded', open); }
  tg.addEventListener('click', () => togglePanel(panel.classList.contains('collapsed')));
  if (narrow()) togglePanel(false);

  paintControls();
  refresh();
  const start = location.hash.slice(1);
  setView(VIEWS.some(v => v.key === start) ? start : VIEWS[0].key, true);
  window.__map = map;
})();
</script>
</body>
</html>
