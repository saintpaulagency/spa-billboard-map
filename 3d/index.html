<html lang="en">

<title>Billboard Map 3D · Saint Paul Agency</title>

<meta name="robots" content="noindex">

<style>
@font-face { font-family: Poppins; font-weight: 400; font-display: swap; src: url(../assets/fonts/poppins-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 500; font-display: swap; src: url(../assets/fonts/poppins-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 600; font-display: swap; src: url(../assets/fonts/poppins-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 700; font-display: swap; src: url(../assets/fonts/poppins-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 800; font-display: swap; src: url(../assets/fonts/poppins-latin-800-normal.woff2) format('woff2'); }
:root {
  --bg: #030814; --glass: rgba(8, 16, 37, .94); --glass-2: rgba(20, 36, 74, .55); --edge: rgba(120, 175, 255, .22); --edge-2: rgba(120, 175, 255, .38);
  --text: #FFFFFF; --text-2: #FFFFFF; --muted: #FFFFFF; --cyan: #39C6FF; --cyan-2: #1E8CFF; --royal: #233975; --navy: #0E1830;
  --font: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 10px 40px rgba(0, 0, 0, .45), 0 0 0 1px rgba(120, 175, 255, .08);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; color: var(--text); font-family: var(--font); -webkit-text-size-adjust: 100%; overflow: hidden;
  background: radial-gradient(1200px 800px at 70% 30%, #0B1A3C 0%, #050C1E 45%, #02050D 100%); }
/* stars behind the globe */
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .75;
  background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 34% 72%, #cfe2ff 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 58% 26%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 76% 64%, #bcd6ff 50%, transparent 51%),
    radial-gradient(1.1px 1.1px at 88% 14%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 22% 46%, #dbe8ff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 66% 88%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 46% 8%, #cfe2ff 50%, transparent 51%),
    radial-gradient(1px 1px at 92% 44%, #fff 50%, transparent 51%), radial-gradient(1.1px 1.1px at 6% 82%, #dbe8ff 50%, transparent 51%);
  background-size: 420px 420px, 380px 380px, 520px 520px, 460px 460px, 610px 610px, 340px 340px, 560px 560px, 490px 490px, 700px 700px, 430px 430px; }
#map { position: fixed; inset: 0; z-index: 0; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--cyan); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- glass panel ---------- */
.panel { position: absolute; z-index: 500; top: 16px; left: 16px; width: 384px; max-height: calc(100% - 32px); overflow: auto; overscroll-behavior: contain; scrollbar-width: thin;
  background: var(--glass);
  border: 1px solid var(--edge); border-radius: 20px; box-shadow: var(--shadow); transition: opacity .6s, transform .6s; }
.panel::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 3px; background: linear-gradient(var(--cyan), var(--cyan-2) 60%, transparent); box-shadow: 0 0 12px var(--cyan); }
body.intro .panel, body.intro .hud-top { opacity: 0; transform: translateY(-8px); pointer-events: none; }
.p-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 22px 20px 16px; border-bottom: 1px solid var(--edge); }
.logo { position: relative; width: 144px; height: 144px; flex: none; border-radius: 50%; background: #fff; display: grid; place-items: center;
  box-shadow: 0 0 0 4px rgba(57, 198, 255, .45), 0 0 34px rgba(57, 198, 255, .55); }
.logo::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1.5px dashed rgba(57, 198, 255, .7); animation: spin 26s linear infinite; }
.logo img { width: 88%; height: auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.p-eyebrow { font-size: 18px; font-weight: 800; letter-spacing: .12em; line-height: 1.2; text-transform: uppercase; color: var(--cyan); }
.p-title { margin: 2px 0 0; font-size: 28px; font-weight: 700; line-height: 1.15; color: #fff; }
.p-sub { font-size: 15.5px; font-weight: 500; color: var(--text-2); margin-top: 3px; }
.p-toggle { display: none; margin-left: auto; flex: none; border: 1px solid var(--edge-2); background: var(--glass-2); border-radius: 10px; padding: 7px 12px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.p-body { padding: 16px 20px 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 14px; }
.stat { padding: 0 10px; border-left: 1px solid var(--edge); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat b { display: block; font-size: 33px; line-height: 1.1; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 0 18px rgba(57, 198, 255, .55); }
.stat b small { font-size: 15px; font-weight: 700; color: var(--muted); text-shadow: none; }
.stat span { display: block; font-size: 14px; font-weight: 500; color: var(--text-2); margin-top: 3px; line-height: 1.3; }
.label { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; margin: 0 0 7px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--edge-2); background: var(--glass-2); border-radius: 12px; padding: 10px 10px; font-size: 15.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(57, 198, 255, .35); }
.btn.primary { background: linear-gradient(135deg, #2BB8FF, #1E6FFF); border-color: transparent; color: #fff; box-shadow: 0 0 18px rgba(43, 184, 255, .45); }
.btn svg { width: 18px; height: 18px; flex: none; }
.seg { display: flex; border: 1px solid var(--edge); border-radius: 12px; padding: 3px; background: rgba(4, 10, 24, .5); gap: 2px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 7px 6px; font-size: 14.5px; font-weight: 600; cursor: pointer; color: var(--text-2); white-space: nowrap; }
.seg button small { font-weight: 600; color: var(--muted); }
.seg button:hover { background: rgba(57, 198, 255, .1); color: #fff; }
.seg button.on { background: linear-gradient(135deg, #2BB8FF, #1E6FFF); color: #fff; box-shadow: 0 0 12px rgba(43, 184, 255, .4); }
.seg button.on small { color: #E2F2FF; }
.views { margin-bottom: 12px; }
.search { position: relative; margin-bottom: 12px; }
.search svg { position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: #fff; pointer-events: none; }
.search input { width: 100%; border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px 10px 38px; font-size: 16px; background: rgba(4, 10, 24, .55); color: #fff; font-weight: 500; }
.search input::placeholder { color: #fff; opacity: 1; }
.search input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(57, 198, 255, .2); }
.hint { font-size: 14px; font-weight: 500; color: var(--text-2); margin-top: 5px; }
.hint:empty { display: none; }
.ops-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 4px; }
.ops-head .label { margin: 0; }
.link { border: 0; background: none; padding: 2px 4px; font-size: 14px; font-weight: 700; color: var(--cyan); cursor: pointer; border-radius: 6px; }
.link[hidden] { display: none; }
.ops { display: grid; grid-template-columns: 1fr; gap: 1px; margin-bottom: 10px; }
.op { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 9px; padding: 5px 6px; cursor: pointer; text-align: left; width: 100%; font-size: 16px; min-width: 0; color: #fff; }
.op:hover { background: rgba(57, 198, 255, .08); }
.op .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--c, var(--cyan)); background: var(--c, var(--cyan)); flex: none; position: relative; box-shadow: 0 0 8px var(--c, var(--cyan)); }
.op .box::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #04102A; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.op.off .box { background: transparent; border-color: #fff; box-shadow: none; }
.op.off .box::after { display: none; }
.op.off .name { text-decoration: line-through; text-decoration-thickness: 2px; }
.op .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op .short { display: none; }
.op .n { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
.rows { display: grid; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row .label { margin: 0; flex: none; }
.row .seg { flex: 0 1 230px; }
@media (min-width: 641px) {   /* the three switches side by side */
  .rows { grid-template-columns: 1fr 1fr 1.25fr; gap: 6px; } .rows .label { display: none; } .rows .seg { flex: 1; } .rows .seg button { font-size: 13.5px; padding: 7px 3px; }
}
.p-foot { border-top: 1px solid var(--edge); margin-top: 14px; padding-top: 11px; font-size: 14px; color: var(--text-2); line-height: 1.55; }
.p-foot a { font-weight: 700; text-decoration: none; white-space: nowrap; }
.p-foot .src { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }

/* ---------- billboards ---------- */
.bb { --s: 1; --h: 1; position: relative; width: 58px; height: 52px; cursor: pointer; transform: scale(calc(var(--s) * var(--h))); transform-origin: 50% 100%; transition: transform .18s; will-change: transform; }
.bb .scr { position: absolute; left: 0; top: 0; width: 58px; height: 33px; border-radius: 4px; overflow: hidden; background: linear-gradient(135deg, #0A3D91, #1B7FE0);
  border: 2.5px solid var(--c); box-shadow: 0 0 10px var(--c), 0 0 22px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 0 1px rgba(0, 0, 0, .6); }
.bb .scr::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 3px), linear-gradient(160deg, rgba(255, 255, 255, .22), transparent 45%); }
.bb .pole { position: absolute; left: 50%; top: 33px; width: 4px; height: 17px; margin-left: -2px; background: linear-gradient(90deg, #6E85B2, #D5E2FA 45%, #5B6F98); border-radius: 0 0 2px 2px; }
.bb .cnt { position: absolute; top: -8px; right: -9px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #fff; color: #04102A; font: 700 11px/18px var(--font); text-align: center; box-shadow: 0 0 10px var(--c); z-index: 2; }
.bb:hover, .bb:focus-visible, .bb.sel { --h: 1.9; }
.bb:focus-visible { outline: none; }
.bb:focus-visible .scr { border-color: #fff; }
.bb.dim { opacity: .25; }
.maplibregl-marker:has(.bb:hover), .maplibregl-marker:has(.bb.sel), .maplibregl-marker:has(.bb:focus-visible) { z-index: 5; }
.far .bb { display: none; }

/* the ads */
.ads { position: absolute; inset: 0; }
.ads { animation: adstrip 14.4s ease-in-out infinite; animation-delay: var(--d, 0s); will-change: transform; }
.ad { position: absolute; left: 0; top: calc(var(--i) * 100%); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.02; letter-spacing: .02em;
  font-family: var(--font); color: #fff; }
.ad b { font-size: 9px; font-weight: 700; } .ad span { font-size: 7px; font-weight: 700; }
.ad img { width: 15px; height: 15px; border-radius: 50%; background: #fff; padding: 1px; margin-bottom: 1px; }
.a-cyan { background: linear-gradient(135deg, #0A3D91, #19A8FF); }
.a-spa { background: linear-gradient(135deg, #FFFFFF, #DCE9FF); color: #0E1830; }
.a-sun { background: linear-gradient(135deg, #FF7A18, #FFB800); color: #1A0B00; }
.a-red { background: linear-gradient(135deg, #B0123B, #FF3D5A); }
.a-lime { background: linear-gradient(135deg, #0B6B3A, #22C55E); }
.a-violet { background: linear-gradient(135deg, #4C1D95, #A855F7); }
@keyframes adstrip { 0%, 14.5% { transform: translateY(0); } 16.67%, 31.17% { transform: translateY(-100%); } 33.33%, 47.83% { transform: translateY(-200%); }
  50%, 64.5% { transform: translateY(-300%); } 66.67%, 81.17% { transform: translateY(-400%); } 83.33%, 97.83% { transform: translateY(-500%); } 100% { transform: translateY(-600%); } }
/* the glow ring on the ground under each board (drawn by the graphics card, no map redraws) */
.bb .ring { position: absolute; left: 50%; bottom: -7px; width: 46px; height: 16px; margin-left: -23px; border: 2px solid var(--c); border-radius: 50%; opacity: 0; pointer-events: none;
  animation: ring 2.4s ease-out infinite; animation-delay: var(--rd, 0s); will-change: transform, opacity; }
@keyframes ring { 0% { transform: scale(.2); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
/* lighter mode for slower computers: no rings; ads play only on the board you point at */
.lite .bb .ring { display: none; }
.lite .bb:not(:hover):not(.sel) .ads { animation-play-state: paused; }

/* hover label */
.tip { position: fixed; z-index: 600; pointer-events: none; background: rgba(6, 14, 32, .92); border: 1px solid var(--edge-2); color: #fff; font-size: 15px; font-weight: 600; padding: 6px 12px;
  border-radius: 9px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); box-shadow: 0 0 16px rgba(57, 198, 255, .25); opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; } .tip b { color: var(--cyan); }

/* ---------- popups ---------- */
.maplibregl-popup-content { background: rgba(8, 17, 38, .94); border: 1px solid var(--edge-2); border-radius: 16px;
  box-shadow: var(--shadow), 0 0 24px rgba(57, 198, 255, .18); padding: 16px 18px; font-family: var(--font); font-size: 15.5px; line-height: 1.45; color: var(--text); min-width: 300px; }
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(8, 17, 38, .94); }
.maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(8, 17, 38, .94); }
.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: rgba(8, 17, 38, .94); }
.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: rgba(8, 17, 38, .94); }
.maplibregl-popup-close-button { font-size: 22px; width: 32px; height: 32px; color: var(--text-2); border-radius: 0 16px 0 8px; }
.maplibregl-popup-close-button:hover { background: rgba(57, 198, 255, .12); color: #fff; }
.pp-screen { position: relative; height: 92px; border-radius: 10px; overflow: hidden; margin: 2px 26px 10px 0; border: 2px solid #CFE0FF; box-shadow: 0 0 16px rgba(57, 198, 255, .35); }
.pp-screen .ad b { font-size: 20px; } .pp-screen .ad span { font-size: 14px; } .pp-screen .ad img { width: 34px; height: 34px; padding: 2px; margin-bottom: 3px; }
.pp-screen::after { content: "SAMPLE AD"; position: absolute; right: 6px; bottom: 4px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.pp-head { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); margin: 0 0 6px; }
.pp-list { max-height: 210px; overflow: auto; }
.pp-board + .pp-board { border-top: 1px solid var(--edge); margin-top: 9px; padding-top: 9px; }
.pp-op { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: #fff; }
.pp-op i { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
.pp-where { color: #fff; font-weight: 500; }
.pp-meta { font-size: 14px; font-weight: 500; color: var(--text-2); }
.pp-btns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.pp-btns a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14.5px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--edge-2); color: #fff; background: var(--glass-2); }
.pp-btns a.sv { background: linear-gradient(135deg, #2BB8FF, #1E6FFF); border-color: transparent; box-shadow: 0 0 14px rgba(43, 184, 255, .4); }
.pp-btns svg { width: 16px; height: 16px; }
.maplibregl-map { font-family: var(--font); }
.maplibregl-ctrl-attrib { background: rgba(4, 10, 24, .75) !important; color: #fff; font-size: 11px; }
.maplibregl-ctrl-attrib a { color: #fff; }
.maplibregl-ctrl-group { background: var(--glass) !important; border: 1px solid var(--edge); box-shadow: var(--shadow) !important; border-radius: 12px !important; overflow: hidden; }
.maplibregl-ctrl-group button { width: 36px; height: 36px; }
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--edge) !important; }
.maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1) brightness(1.4); }
.maplibregl-ctrl-scale { background: rgba(4, 10, 24, .7); color: #fff; border-color: #fff; font-weight: 600; }

/* ---------- intro, status, tour caption ---------- */
.intro-card { position: fixed; z-index: 700; left: 50%; bottom: 9%; transform: translateX(-50%); text-align: center; pointer-events: none; transition: opacity .8s; }
.intro-card .logo { width: 124px; height: 124px; margin: 0 auto 14px; }
.intro-card .e { font-size: 19px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 14px rgba(57, 198, 255, .6); }
.intro-card .t { font-size: 42px; font-weight: 700; margin-top: 4px; text-shadow: 0 0 30px rgba(57, 198, 255, .45); }
.intro-card .s { font-size: 18px; font-weight: 500; color: var(--text-2); margin-top: 4px; }
body:not(.intro) .intro-card { opacity: 0; }
.intro-card .s span { display: block; white-space: nowrap; }
@media (min-width: 900px) {   /* beside the globe, not on top of it */
  .intro-card { left: 5.5%; top: 50%; bottom: auto; transform: translateY(-50%); text-align: left; max-width: calc(44.5vw - 26vh - 20px); }
  .intro-card .t { font-size: clamp(26px, calc(4.15vw - 2.43vh - 2px), 54px); }
  .intro-card .logo { margin: 0 0 14px; }
}
@media (min-width: 900px) and (max-width: 1250px) { .intro-card .s { font-size: 16px; } }
@media (min-width: 1600px) and (min-height: 900px) { .intro-card .e { font-size: 23px; } .intro-card .s { font-size: 21px; } .intro-card .logo { width: 160px; height: 160px; } }
body.intro .maplibregl-ctrl-top-right { opacity: 0; pointer-events: none; }
.skip { position: fixed; z-index: 710; right: 20px; bottom: 34px; border: 1px solid var(--edge-2); background: var(--glass); border-radius: 12px; padding: 9px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
body:not(.intro) .skip { display: none; }
.status { position: fixed; z-index: 720; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--glass); border: 1px solid var(--edge-2); border-radius: 14px;
  padding: 14px 18px; font-size: 15px; max-width: calc(100% - 40px); text-align: center; box-shadow: var(--shadow); }
.status[hidden] { display: none; }
.caption { position: fixed; z-index: 550; left: 50%; bottom: 40px; transform: translate(-50%, 12px); opacity: 0; transition: opacity .5s, transform .5s; pointer-events: none;
  background: var(--glass); border: 1px solid var(--edge-2); border-radius: 16px; padding: 12px 20px; text-align: center; box-shadow: var(--shadow), 0 0 26px rgba(57, 198, 255, .2); min-width: 280px; }
.caption.on { opacity: 1; transform: translate(-50%, 0); }
.caption .k { font-size: 13.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.caption .t { font-size: 32px; font-weight: 700; margin-top: 2px; }
.caption .s { font-size: 17px; font-weight: 500; color: var(--text-2); }
.stopTour { position: fixed; z-index: 560; right: 20px; bottom: 40px; display: none; }
body.touring .stopTour { display: flex; }

/* ---------- presenting ---------- */
.badge { display: none; position: absolute; z-index: 500; top: 16px; left: 16px; align-items: center; gap: 14px; background: var(--glass);
  border: 1px solid var(--edge); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 14px; max-width: calc(100% - 100px); }
.badge .logo { width: 86px; height: 86px; } .badge .logo::after { inset: -7px; }
.badge .b-eyebrow { font-size: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.badge .b-title { font-size: 25px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.badge .b-sub { font-size: 15.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.b-btns { display: flex; gap: 6px; margin-left: 8px; }
.b-btns button { border: 1px solid var(--edge-2); background: var(--glass-2); border-radius: 999px; padding: 7px 14px; font-size: 14.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.b-btns button.on { background: linear-gradient(135deg, #2BB8FF, #1E6FFF); border-color: transparent; }
.legend { display: none; position: absolute; z-index: 500; left: 16px; bottom: 34px; background: var(--glass); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px; font-size: 15.5px; font-weight: 600; }

.legend i { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
body.present .panel { display: none; }
body.present .badge { display: flex; }
body.present.by-ops .legend { display: block; }

/* ---------- shorter laptop screens: keep the whole panel in view ---------- */
@media (min-width: 641px) and (max-height: 980px) {   /* most laptops: same big logo on top, tighter controls */
  .p-head { gap: 8px; padding: 16px 18px 12px; }
  .p-head .logo { width: 126px; height: 126px; }
  .p-body { padding: 12px 18px 12px; }
  .stats { grid-template-columns: 1.4fr 1fr 1fr; margin-bottom: 10px; } .stat b { font-size: 29px; } .stat span { font-size: 13.5px; margin-top: 1px; }
  .btns { margin-bottom: 10px; } .btn { padding: 8px 8px; font-size: 15px; }
  .views, .search { margin-bottom: 9px; }
  .search input { padding-top: 7px; padding-bottom: 7px; } .search svg { top: 9px; }
  .ops { grid-template-columns: 1fr 1fr; column-gap: 4px; margin-bottom: 8px; }
  .op { font-size: 15px; gap: 8px; padding: 3px 5px; } .op .full { display: none; } .op .short { display: inline; }
  .op .box { width: 18px; height: 18px; } .op .box::after { left: 4px; top: 0; width: 5px; height: 9.5px; }
  .rows { grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .rows .label { display: none; } .rows .seg { flex: 1; } .rows .seg button { font-size: 13.5px; padding: 6px 3px; }
  .p-foot { margin-top: 8px; padding-top: 7px; font-size: 13.5px; line-height: 1.45; } .p-foot .src { font-size: 12.5px; }
}
@media (min-width: 641px) and (max-height: 760px) {   /* short laptop screens: logo beside the title */
  .p-head { flex-direction: row; text-align: left; gap: 14px; padding: 12px 16px 10px; }
  .p-head .logo { width: 98px; height: 98px; } .p-head .logo::after { inset: -6px; }
  .p-title { font-size: 23px; text-wrap: balance; } .p-eyebrow { font-size: 15px; letter-spacing: .06em; } .p-sub { font-size: 14px; }
  .p-body { padding: 10px 16px 10px; }
  .stats, .btns { margin-bottom: 8px; } .views, .search { margin-bottom: 8px; }
  .op { padding: 2px 5px; } .ops { margin-bottom: 6px; }
  .rows .seg button { padding: 5px 3px; }
  .p-foot { margin-top: 6px; padding-top: 6px; } .p-foot .src { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
@media (max-width: 1100px) { .b-btns .v { display: none; } }
/* ---------- phones ---------- */
@media (max-width: 640px) {
  .panel { top: 10px; left: 10px; right: 10px; width: auto; max-height: calc(100% - 20px); }
  .p-head { flex-direction: row; text-align: left; gap: 12px; padding: 10px 12px; border-bottom: 0; }
  .p-head .logo { width: 64px; height: 64px; } .p-head .logo::after { inset: -5px; }
  .p-title { font-size: 20px; text-wrap: balance; } .p-eyebrow { font-size: 14px; letter-spacing: .06em; }
  .p-toggle { display: block; }
  .panel:not(.collapsed) .p-head { border-bottom: 1px solid var(--edge); }
  .panel.collapsed .p-body, .panel.collapsed .p-sub { display: none; }
  .panel.collapsed { overflow: hidden; }
  .p-body { padding: 12px; }
  .tip { display: none; }
  .intro-card { top: 64px; bottom: auto; width: calc(100% - 40px); }
  .intro-card .t { font-size: 25px; } .intro-card .e { font-size: 15px; letter-spacing: .14em; } .intro-card .s { font-size: 13.5px; }
  .intro-card .logo { width: 64px; height: 64px; margin-bottom: 10px; }
  .badge { top: 10px; left: 10px; gap: 10px; padding: 8px 10px; } .badge .logo { width: 56px; height: 56px; } .badge .b-title { font-size: 18px; } .badge .b-sub { font-size: 13.5px; }
  .b-btns { display: none; }
  .legend { left: 10px; bottom: 30px; }

  .maplibregl-ctrl-top-right { top: 86px; }

}
@media (prefers-reduced-motion: reduce) { .ads, .bb .ring { animation: none; } .logo::after { animation: none; } .bb { transition: none; } }

<body class="intro">
<div id="map" role="region" aria-label="3D map of billboard locations"></div>

<div class="intro-card" aria-hidden="true">

<div class="status" id="status" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.7.0/maplibre-gl.min.js"></script>
<script src="../data/boards.js"></script>
<script>
(async function () {
  const statusEl = document.getElementById('status');
  const fail = msg => { statusEl.innerHTML = msg + ' <a href="../">Open the classic map</a>.'; statusEl.hidden = false; document.body.classList.remove('intro'); };
  if (!window.maplibregl || !window.BOARDS) return fail('The 3D map couldn’t load. Check the internet connection, or use the backup PDF.');
  const DATA = window.BOARDS, ALL = DATA.boards;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => n.toLocaleString('en-US');
  const narrow = () => window.matchMedia('(max-width: 640px)').matches;
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- data ----------
  const spots = [], byKey = {};
  ALL.forEach(b => { const k = b.lat.toFixed(5) + ',' + b.lon.toFixed(5); if (!byKey[k]) { byKey[k] = { lat: b.lat, lon: b.lon, boards: [] }; spots.push(byKey[k]); } byKey[k].boards.push(b); });
  spots.forEach((s, i) => { s.i = i; });
  const opCount = {}; ALL.forEach(b => { opCount[b.operator] = (opCount[b.operator] || 0) + 1; });
  const OPS = Object.keys(opCount).sort((a, b) => opCount[b] - opCount[a] || a.localeCompare(b));
  const opOn = new Set(OPS);
  const SUB = DATA.title.replace(/^Digital billboard inventory\s*·?\s*/i, '') || DATA.title;
  document.getElementById('subtitle').textContent = SUB;
  document.getElementById('introSub').innerHTML = `<span>${fmt(ALL.length)} digital billboards</span><span>${esc(SUB)}</span>`;
  const built = DATA.built ? new Date(DATA.built + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const srcEl = document.getElementById('src');
  srcEl.textContent = `Source: Basis${built ? ', ' + built : ''}` + (DATA.repeats ? ` · ${DATA.repeats} duplicates removed` : '');
  srcEl.title = srcEl.textContent;

  const PALETTE = ['#39C6FF', '#FF8A3D', '#3DDC84', '#B47CFF', '#FF4D8D', '#2EE6D6', '#C9D4E8', '#FFD43B'];
  const SPA = '#39C6FF';
  const opColor = {}; OPS.forEach((o, i) => { opColor[o] = PALETTE[i % PALETTE.length]; });
  let colorMode = store.get('spa3dColor') === 'ops' ? 'ops' : 'one';
  let mapStyle = store.get('spa3dMap') === 'day' ? 'day' : 'night';
  let dim3d = store.get('spa3dDim') !== '2d';
  const colorOf = s => colorMode === 'ops' ? opColor[shown(s)[0] ? shown(s)[0].operator : s.boards[0].operator] : SPA;

  // the sample ads every billboard plays (generic, no client)
  const ADS = [['YOUR AD', 'HERE', 'a-cyan'], ['SAINT PAUL', 'AGENCY', 'a-spa', 1], ['GRAND', 'OPENING', 'a-sun'], ['BIG SALE', '50% OFF', 'a-red'], ['NOW', 'HIRING', 'a-lime'], ['OPEN', '24/7', 'a-violet']];
  const adsHtml = d => `<div class="ads" style="--d:${d}s">` + ADS.concat([ADS[0]]).map((a, i) => `<div class="ad ${a[2]}" style="--i:${i}">${a[3] ? '<img src="../assets/img/spa-logo.png" alt="">' : ''}<b>${a[0]}</b><span>${a[1]}</span></div>`).join('') + '</div>';

  // ---------- map styles: night (our own colors on OpenFreeMap's dark map) and day ----------
  const STYLE_URL = { night: 'https://tiles.openfreemap.org/styles/dark', day: 'https://tiles.openfreemap.org/styles/liberty' };
  const styleCache = {};
  async function getStyle(kind) {
    if (styleCache[kind]) return JSON.parse(JSON.stringify(styleCache[kind]));
    const st = await (await fetch(STYLE_URL[kind])).json();
    if (kind === 'night') nightify(st); else dayify(st);
    st.projection = { type: 'globe' };
    styleCache[kind] = st;
    return JSON.parse(JSON.stringify(st));
  }
  // multiply a text size that may be a number or a zoom curve
  function scaleSize(v, k) {
    if (typeof v === 'number') return +(v * k).toFixed(1);
    if (Array.isArray(v) && v[0] === 'interpolate') return v.map((x, i) => i >= 3 && i % 2 === 0 && typeof x === 'number' ? +(x * k).toFixed(1) : x);
    if (v && v.stops) return Object.assign({}, v, { stops: v.stops.map(([z, x]) => [z, typeof x === 'number' ? +(x * k).toFixed(1) : x]) });
    return v == null ? +(16 * k).toFixed(1) : v;
  }
  function nightify(st) {
    const firstSymbol = st.layers.findIndex(l => l.type === 'symbol');
    st.layers.forEach(l => {
      const p = l.paint || (l.paint = {}), id = l.id;
      if (l.type === 'background') p['background-color'] = '#040B1C';
      else if (id === 'water') p['fill-color'] = '#071833';
      else if (id === 'waterway') p['line-color'] = '#0A2244';
      else if (l.type === 'fill' && /landcover|landuse|park|aeroway/.test(id)) p['fill-color'] = '#0A1631';
      else if (id === 'building') { l.layout = Object.assign(l.layout || {}, { visibility: 'none' }); }
      else if (l.type === 'line' && /boundary/.test(id)) p['line-color'] = '#2A4C86';
      else if (l.type === 'line' && /motorway/.test(id)) p['line-color'] = /casing/.test(id) ? '#1E63B8' : '#3AA8FF';
      else if (l.type === 'line' && /major/.test(id)) p['line-color'] = /casing/.test(id) ? '#1B3A6E' : '#16315E';
      else if (l.type === 'line' && /minor|path|pier/.test(id)) p['line-color'] = '#10213F';
      else if (l.type === 'line' && /rail/.test(id)) p['line-color'] = '#15294C';
      else if (l.type === 'line' && /aeroway/.test(id)) p['line-color'] = '#132849';
      if (l.type === 'symbol' && l.layout && l.layout['text-font']) {      // bigger, bolder, brighter place names
        const big = /place_city|place_state|country/.test(id), mid = /place_town|place_suburb/.test(id);
        p['text-color'] = '#FFFFFF';
        p['text-halo-color'] = 'rgba(3, 9, 24, .96)'; p['text-halo-width'] = 1.6; p['text-halo-blur'] = 0.3;
        if (big || mid) l.layout['text-font'] = ['Noto Sans Bold'];
        if (/place_village/.test(id)) l.minzoom = Math.max(l.minzoom || 0, 10.5);
        if (/place_other/.test(id)) l.minzoom = Math.max(l.minzoom || 0, 12);
        l.layout['text-size'] = scaleSize(l.layout['text-size'], big ? 1.35 : mid ? 1.25 : 1.15);
      }
    });
    // glowing highways and 3D buildings, under the labels
    st.layers.splice(firstSymbol, 0,
      { id: 'motorway-glow', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation', filter: ['==', ['get', 'class'], 'motorway'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#39C6FF', 'line-opacity': 0.3, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 3, 10, 9, 14, 22], 'line-blur': ['interpolate', ['linear'], ['zoom'], 6, 3, 10, 7, 14, 14] } },
      { id: 'building-3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building', minzoom: 12,
        paint: { 'fill-extrusion-color': ['interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 8], 0, '#0F2248', 30, '#18386F', 90, '#2557A8', 200, '#3B86E0'],
          'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 12, 0, 13.5, ['coalesce', ['get', 'render_height'], 8]],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0], 'fill-extrusion-opacity': 0.88 } });
    st.sky = { 'sky-color': '#071330', 'horizon-color': '#1B4C9E', 'fog-color': '#040B1C', 'sky-horizon-blend': 0.7, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.85,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 9, 0.4, 12, 0] };
  }
  function dayify(st) {
    st.layers.forEach(l => { if (/^poi|^road_one_way/.test(l.id)) l.layout = Object.assign(l.layout || {}, { visibility: 'none' }); });
    st.sky = { 'sky-color': '#7DB7F2', 'horizon-color': '#DCEBFF', 'fog-color': '#EEF4FF', 'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.9,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 9, 0.4, 12, 0] };
  }

  // the globe fills about half the screen height (or most of a phone's width)
  const globeZoom = () => Math.max(0.6, Math.min(2.2, Math.log2(Math.min(innerHeight * 0.52, innerWidth * 0.72) / 151)));
  // drawing quality: 2 full, 1 lighter, 0 lightest; steps down by itself if the computer struggles, and is remembered
  const DPR = window.devicePixelRatio || 1, PIXELS = [1, Math.min(DPR, 1.25), Math.min(DPR, 1.5)];
  let quality = Math.max(0, Math.min(2, parseInt(store.get('spa3dQ') || '2', 10) || 0));
  if (quality < 2) document.body.classList.add('lite');
  let map, firstStyle;
  try { firstStyle = await getStyle(mapStyle); }
  catch (e) { return fail('The map couldn’t load. Check the internet connection, or use the backup PDF.'); }
  try {
    map = new maplibregl.Map({ container: 'map', style: firstStyle, center: [-75, 30], zoom: globeZoom(), pitch: 0, bearing: 0,
      maxPitch: 75, attributionControl: { compact: true }, canvasContextAttributes: { antialias: false },
      pixelRatio: PIXELS[quality] });
  } catch (e) { return fail('This computer’s browser can’t draw the 3D map (it needs WebGL).'); }
  map.addControl(new maplibregl.NavigationControl({ showCompass: true, visualizePitch: true }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');
  let loaded = false;
  map.on('error', e => console.warn('map:', e && e.error ? e.error.message : e));   // a missing tile shouldn't stop the show
  setTimeout(() => { if (!loaded) fail('The map is slow to load. Check the internet connection, or use the backup PDF.'); }, 20000);

  // ---------- ground glow under every board (drawn by the map, so it lies flat on the ground) ----------
  function spotsGeo() {
    return { type: 'FeatureCollection', features: spots.filter(s => shown(s).length).map(s => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
      properties: { c: colorOf(s), n: shown(s).length, g: s.i % 3 } })) };
  }
  function addOverlays() {
    if (map.getSource('spots')) return;
    map.addSource('spots', { type: 'geojson', data: spotsGeo() });
    const night = mapStyle === 'night';
    map.addLayer({ id: 'spot-glow', type: 'circle', source: 'spots', paint: { 'circle-color': ['get', 'c'], 'circle-blur': 1, 'circle-pitch-alignment': 'map',
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 3, 6, 8, 10, 11, 22, 15, 60], 'circle-opacity': night ? 0.55 : 0.35 } });
    map.addLayer({ id: 'spot-core', type: 'circle', source: 'spots', paint: { 'circle-color': ['get', 'c'], 'circle-pitch-alignment': 'map',
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 3, 2, 9, 3, 14, 6], 'circle-stroke-color': night ? '#fff' : '#0E1830', 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 3, 0.5, 12, 1.5] } });
    map.setLayoutProperty('building-3d', 'visibility', dim3d ? 'visible' : 'none');
    if (quality === 0 && map.getLayer('motorway-glow')) map.setLayoutProperty('motorway-glow', 'visibility', 'none');
  }
  map.on('style.load', addOverlays);

  // ---------- billboards ----------
  let query = '';
  const squash = t => t.replace(/[\s\-–.]/g, '');
  ALL.forEach(b => { b._hay = [b.operator, b.where, b.city, b.code, b.id, b.zip].join(' ').toLowerCase(); b._sq = squash(b._hay); });
  const matchQ = b => !query || b._hay.includes(query) || b._sq.includes(squash(query));
  const shown = s => s.boards.filter(b => opOn.has(b.operator) && matchQ(b));
  const sv = (lat, lon) => `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`;
  const gm = (lat, lon) => `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
  const icoEye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg>';

  const popup = new maplibregl.Popup({ offset: [0, -58], maxWidth: '380px', focusAfterOpen: false });
  let selected = null;
  popup.on('close', () => { if (selected) selected.el.classList.remove('sel'); selected = null; });
  function popupHtml(s) {
    const list = shown(s), dot = o => colorMode === 'ops' ? `<i style="background:${opColor[o]};color:${opColor[o]}"></i>` : '';
    return `<div class="pp-screen">${adsHtml(-((s.i * 1.7) % 14.4).toFixed(1))}</div>` +
      (list.length > 1 ? `<div class="pp-head">${list.length} boards at this spot</div>` : '') +
      '<div class="pp-list">' + list.map(b => `<div class="pp-board"><div class="pp-op">${dot(b.operator)}${esc(b.operator)}</div><div class="pp-where">${esc(b.where || 'Location not listed')}</div>` +
      `<div class="pp-meta">${esc(b.city)}${b.zip ? ' ' + esc(b.zip) : ''}${b.code ? ' · Board ' + esc(b.code) : ''}</div></div>`).join('') + '</div>' +
      `<div class="pp-btns"><a class="sv" href="${sv(s.lat, s.lon)}" target="_blank" rel="noopener">${icoEye}Open Street View</a><a href="${gm(s.lat, s.lon)}" target="_blank" rel="noopener">Google Maps</a></div>`;
  }
  function openSpot(s) {
    hideTip(); stopOrbit();
    const pt = map.project([s.lon, s.lat]), W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
    const left = narrow() || presenting() ? 190 : 620, top = narrow() ? 470 : 460;
    if (pt.x < left || pt.x > W - 200 || pt.y < top || pt.y > H - 40) {
      const target = narrow() ? [W / 2, H - 60] : [Math.max(left, W * 0.6), H * 0.8];
      map.easeTo({ center: [s.lon, s.lat], offset: [target[0] - W / 2, target[1] - H / 2], duration: 450 });
    }
    if (selected) selected.el.classList.remove('sel');
    selected = s; s.el.classList.add('sel');
    popup.setLngLat([s.lon, s.lat]).setHTML(popupHtml(s)).addTo(map);
  }
  const tip = document.getElementById('tip');
  function showTip(s) {
    if (narrow() || selected === s) return;
    const l = shown(s); if (!l.length) return;
    tip.innerHTML = l.length > 1 ? `<b>${l.length} boards</b> · ${esc(s.boards[0].city)}` : `<b>${esc(l[0].operator)}</b> · ${esc(l[0].city)}`;
    // place it above the board as it will be once it has grown (it grows from its foot)
    const r = s.el.getBoundingClientRect(), sc = parseFloat(s.el.style.getPropertyValue('--s')) || 1;
    tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = (r.bottom - 52 * sc * 1.9) + 'px'; tip.classList.add('on');
  }
  function hideTip() { tip.classList.remove('on'); }

  spots.forEach(s => {
    const el = document.createElement('div');
    const bb = document.createElement('div'); bb.className = 'bb'; bb.tabIndex = 0; bb.setAttribute('role', 'button');
    bb.innerHTML = `<div class="ring" style="--rd:${-((s.i * 0.37) % 2.4).toFixed(2)}s"></div><div class="scr">${adsHtml(-((s.i * 1.7) % 14.4).toFixed(1))}</div><div class="pole"></div>`;
    s.cnt = document.createElement('span'); s.cnt.className = 'cnt'; bb.appendChild(s.cnt);
    el.appendChild(bb); s.el = bb;
    bb.addEventListener('click', e => { e.stopPropagation(); openSpot(s); });
    bb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSpot(s); } });
    bb.addEventListener('mouseenter', () => showTip(s)); bb.addEventListener('mouseleave', hideTip);
    bb.addEventListener('focus', () => showTip(s)); bb.addEventListener('blur', hideTip);
    s.marker = new maplibregl.Marker({ element: el, anchor: 'bottom', pitchAlignment: 'viewport', rotationAlignment: 'viewport' }).setLngLat([s.lon, s.lat]);
  });

  // billboards stand up on the tilted map; nearer ones are bigger, far-away ones smaller
  const zoomScale = z => z < 8.5 ? 0.5 : z < 9.6 ? 0.62 : z < 11 ? 0.78 : z < 12.5 ? 0.92 : 1.05;
  let far = null;
  function sizeBoards() {
    const z = map.getZoom(), H = map.getContainer().clientHeight, pitch = map.getPitch() / 60, base = zoomScale(z);
    if (far !== (z < 6.2)) { far = z < 6.2; map.getContainer().classList.toggle('far', far); }
    if (far) return;
    spots.forEach(s => {
      if (!s.on) return;
      const y = map.project([s.lon, s.lat]).y;
      const persp = 1 - pitch * 0.55 * (1 - Math.min(1, Math.max(0, y / H)));
      const v = Math.round(base * persp * 40) / 40;                 // steps of 0.025, so tiny changes don't restyle
      if (v !== s.size) { s.size = v; s.el.style.setProperty('--s', v); }
    });
  }
  let lastSize = 0, sizeTimer = null;
  map.on('move', () => {
    hideTip();
    const now = performance.now();
    if (now - lastSize > 100) { lastSize = now; sizeBoards(); }
    else if (!sizeTimer) sizeTimer = setTimeout(() => { sizeTimer = null; lastSize = performance.now(); sizeBoards(); }, 110);
  });
  map.on('moveend', sizeBoards);

  const filtered = () => !!query || opOn.size < OPS.length;
  function refresh() {
    let nb = 0, ns = 0; const seenOps = new Set();
    spots.forEach(s => {
      const l = shown(s); s.on = !!l.length;
      if (!s.on) { s.marker.remove(); return; }
      nb += l.length; ns++; l.forEach(b => seenOps.add(b.operator));
      s.el.style.setProperty('--c', colorOf(s));
      s.cnt.textContent = l.length; s.cnt.style.display = l.length > 1 ? '' : 'none';
      s.el.setAttribute('aria-label', l.length > 1 ? `${l.length} boards in ${s.boards[0].city}` : `${l[0].operator} board in ${l[0].city}`);
      if (started) s.marker.addTo(map);
    });
    if (map.getSource('spots')) map.getSource('spots').setData(spotsGeo());
    totals = { nb, ns, no: seenOps.size };
    if (counted) paintStats();
    document.getElementById('bSub').textContent = `${fmt(nb)} digital billboards · ${fmt(ns)} locations`;
    document.getElementById('hint').textContent = query ? (nb ? `${fmt(nb)} board${nb === 1 ? '' : 's'} match · press Enter to fly to them` : 'No boards match') : '';
    document.getElementById('opsAll').hidden = opOn.size === OPS.length;
    sizeBoards();
  }
  let totals = { nb: ALL.length, ns: spots.length, no: OPS.length }, counted = false, started = false;
  function paintStats() {
    document.getElementById('sBoards').innerHTML = filtered() ? `${fmt(totals.nb)}<small> / ${fmt(ALL.length)}</small>` : fmt(ALL.length);
    document.getElementById('sBoardsL').textContent = filtered() ? 'boards shown' : 'digital billboards';
    document.getElementById('sSpots').textContent = fmt(totals.ns);
    document.getElementById('sOps').textContent = fmt(totals.no);
  }
  function countUp() {                                    // numbers roll up when the map arrives
    const els = ['sBoards', 'sSpots', 'sOps'].map(id => document.getElementById(id)), to = [totals.nb, totals.ns, totals.no], t1 = performance.now();
    (function step() { const k = Math.min(1, (performance.now() - t1) / 1300), e = 1 - Math.pow(1 - k, 3);
      els.forEach((el, i) => { el.textContent = fmt(Math.round(to[i] * e)); });
      if (k < 1 && !calm) requestAnimationFrame(step); else { counted = true; paintStats(); } })();
  }

  // ---------- views and camera ----------
  const VIEWS = (DATA.views || []).concat([{ key: 'all', label: 'All boards', short: 'All', count: ALL.length }]);
  const inView = (v, b) => !v.box || (b.lat >= v.box[0] && b.lat <= v.box[2] && b.lon >= v.box[1] && b.lon <= v.box[3]);
  const presenting = () => document.body.classList.contains('present');
  const PITCH = () => dim3d ? (narrow() ? 50 : 58) : 0, BEARING = () => dim3d ? -17 : 0;
  function pad() {
    if (presenting()) return narrow() ? { top: 110, bottom: 40, left: 30, right: 30 } : { top: 150, bottom: 50, left: 70, right: 80 };
    const pn = document.getElementById('panel');
    return narrow() ? { top: pn.offsetHeight + 60, bottom: 40, left: 30, right: 30 } : { top: 80, bottom: 60, left: pn.offsetWidth + 80, right: 90 };
  }
  function cameraFor(list) {
    const lons = list.map(b => b.lon), lats = list.map(b => b.lat);
    const cam = map.cameraForBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: pad(), maxZoom: 14.5, bearing: BEARING() });
    if (!cam) return null;
    const out = { center: maplibregl.LngLat.convert(cam.center), zoom: cam.zoom, pitch: PITCH(), bearing: BEARING() };
    if (dim3d) { try { fitTilted(out, list); } catch (e) { out.zoom -= 0.15; } }
    return out;
  }
  // On a tilted map the near side looks bigger and the far side smaller, so the flat fit above is only a start:
  // try the camera off-screen and nudge it until every board sits inside the clear area (beside the panel).
  function fitTilted(cam, list) {
    const P = pad(), W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
    const box = { x0: P.left, y0: P.top + 34, x1: W - P.right, y1: H - P.bottom };   // +34: room for the billboard above its spot
    const t = map.transform.clone(), pts = list.map(b => new maplibregl.LngLat(b.lon, b.lat));
    t.setPadding({ top: 0, bottom: 0, left: 0, right: 0 }); t.setPitch(cam.pitch); t.setBearing(cam.bearing);
    for (let i = 0; i < 10; i++) {
      t.setCenter(cam.center); t.setZoom(cam.zoom);
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      pts.forEach(p => { const q = t.locationToScreenPoint(p); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); });
      const dz = Math.log2(Math.min((box.x1 - box.x0) / Math.max(1, x1 - x0), (box.y1 - box.y0) / Math.max(1, y1 - y0)));
      const dx = (x0 + x1) / 2 - (box.x0 + box.x1) / 2, dy = (y0 + y1) / 2 - (box.y0 + box.y1) / 2;
      cam.center = t.screenPointToLocation(new maplibregl.Point(W / 2 + dx, H / 2 + dy));
      cam.zoom = Math.min(14.5, cam.zoom + dz * 0.85);
      if (Math.abs(dz) < 0.01 && Math.abs(dx) < 2 && Math.abs(dy) < 2) break;
    }
    cam.zoom -= 0.03;
  }
  let current = VIEWS[0].key;
  function setView(key, how) {
    const v = VIEWS.find(x => x.key === key) || VIEWS[0]; current = v.key; popup.remove();
    document.querySelectorAll('#views button, #bBtns button[data-k]').forEach(b => { const on = b.dataset.k === v.key; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const cam = cameraFor(ALL.filter(b => inView(v, b))); if (!cam) return;
    if (how === 'jump') map.jumpTo(cam); else map.flyTo(Object.assign(cam, { duration: how === 'intro' ? 7000 : 1800, curve: 1.5, essential: true }));
    if (how !== 'intro' && how !== 'jump') history.replaceState(null, '', '#' + v.key);
  }
  document.getElementById('views').innerHTML = VIEWS.map(v => `<button type="button" data-k="${v.key}">${esc(v.short || v.label)} <small>${fmt(v.count)}</small></button>`).join('');
  document.getElementById('bBtns').innerHTML = '<button type="button" class="t">▶ Tour</button>' + VIEWS.map(v => `<button type="button" class="v" data-k="${v.key}">${esc(v.label)}</button>`).join('') + '<button type="button" class="x">Exit</button>';
  document.getElementById('views').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { stopTour(); setView(b.dataset.k); } });
  document.getElementById('bBtns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('x')) setPresent(false); else if (b.classList.contains('t')) startTour(); else if (b.dataset.k) { stopTour(); setView(b.dataset.k); }
  });

  // ---------- controls ----------
  const opsEl = document.getElementById('ops');
  const shortName = o => { let t = o, prev; do { prev = t; t = t.replace(/\s+(Outdoor|Media|US|USA|Billboards?|Advertising|Inc\.?|LLC|Co\.?)$/i, ''); } while (t !== prev && t.length > 3); return t || o; };
  opsEl.innerHTML = OPS.map(o => `<button type="button" class="op" data-o="${esc(o)}" title="${esc(o)}"><span class="box" data-c="${opColor[o]}"></span><span class="name"><span class="full">${esc(o)}</span><span class="short">${esc(shortName(o))}</span></span><span class="n">${fmt(opCount[o])}</span></button>`).join('');
  const legendEl = document.getElementById('legend');
  function paintControls() {
    const byOps = colorMode === 'ops';
    document.body.classList.toggle('by-ops', byOps);
    const mark = (sel, attr, val) => document.querySelectorAll(sel).forEach(b => { const on = b.dataset[attr] === val; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    mark('#colorMode button', 'c', colorMode); mark('#mapStyle button', 'm', mapStyle); mark('#dim button', 'v', dim3d ? '3d' : '2d');
    opsEl.querySelectorAll('.op').forEach(x => { const on = opOn.has(x.dataset.o); x.classList.toggle('off', !on); x.setAttribute('aria-pressed', on); });
    opsEl.querySelectorAll('.box').forEach(x => { if (byOps) x.style.setProperty('--c', x.dataset.c); else x.style.removeProperty('--c'); });
    legendEl.innerHTML = OPS.filter(o => opOn.has(o)).map(o => `<div><i style="background:${opColor[o]};color:${opColor[o]}"></i>${esc(o)}</div>`).join('');
  }
  document.getElementById('colorMode').addEventListener('click', e => { const b = e.target.closest('button[data-c]'); if (!b) return; colorMode = b.dataset.c; store.set('spa3dColor', colorMode); if (selected) popup.setHTML(popupHtml(selected)); paintControls(); refresh(); });
  document.getElementById('mapStyle').addEventListener('click', async e => {
    const b = e.target.closest('button[data-m]'); if (!b || b.dataset.m === mapStyle) return;
    mapStyle = b.dataset.m; store.set('spa3dMap', mapStyle); paintControls();
    map.setStyle(await getStyle(mapStyle), { diff: false });
  });
  document.getElementById('dim').addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    dim3d = b.dataset.v === '3d'; store.set('spa3dDim', dim3d ? '3d' : '2d'); paintControls();
    if (map.getLayer('building-3d')) map.setLayoutProperty('building-3d', 'visibility', dim3d ? 'visible' : 'none');
    stopTour(); map.easeTo({ pitch: PITCH(), bearing: BEARING(), duration: 1200 });
  });
  opsEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-o]'); if (!b) return;
    const o = b.dataset.o; if (opOn.has(o)) opOn.delete(o); else opOn.add(o);
    if (!opOn.size) OPS.forEach(x => opOn.add(x));
    popup.remove(); paintControls(); refresh();
  });
  document.getElementById('opsAll').addEventListener('click', () => { OPS.forEach(x => opOn.add(x)); popup.remove(); paintControls(); refresh(); });
  const q = document.getElementById('q');
  q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); popup.remove(); refresh(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const l = ALL.filter(b => opOn.has(b.operator) && matchQ(b)); if (l.length) { stopTour(); const cam = cameraFor(l); if (cam) map.flyTo(Object.assign(cam, { duration: 1600, essential: true })); } if (narrow()) togglePanel(false); }
    if (e.key === 'Escape') { e.stopPropagation(); q.value = ''; query = ''; refresh(); }
  });
  const panel = document.getElementById('panel'), tg = document.getElementById('toggle');
  function togglePanel(open) { panel.classList.toggle('collapsed', !open); tg.textContent = open ? 'Hide' : 'Show'; tg.setAttribute('aria-expanded', open); }
  tg.addEventListener('click', () => togglePanel(panel.classList.contains('collapsed')));
  if (narrow()) togglePanel(false);

  // ---------- presenting: full screen + slow orbit ----------
  let orbiting = false;
  function startOrbit() { if (calm || !dim3d) return; orbiting = true; }
  function stopOrbit() { orbiting = false; }
  ['mousedown', 'wheel', 'touchstart', 'keydown'].forEach(ev => map.getContainer().addEventListener(ev, stopOrbit, { passive: true }));
  function setPresent(on) {
    if (on === presenting()) return;
    document.body.classList.toggle('present', on); popup.remove(); hideTip();
    const el = document.documentElement;
    if (on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    setTimeout(() => { map.resize(); setView(current); if (on) map.once('moveend', () => { if (presenting() && !touring) startOrbit(); }); else stopOrbit(); }, 250);
  }
  document.getElementById('present').addEventListener('click', () => setPresent(true));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && presenting()) setPresent(false); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (touring) { stopTour(); return; }
    if (popup.isOpen()) { popup.remove(); return; }
    if (presenting() && !document.fullscreenElement) setPresent(false);
  });

  // ---------- guided tour: the busiest areas, biggest first, then St. Cloud, then everything ----------
  function tourStops() {
    const cells = {};
    spots.forEach(s => { const l = shown(s); if (!l.length) return; const k = Math.round(s.lat / 0.09) + ',' + Math.round(s.lon / 0.12); (cells[k] = cells[k] || []).push(s); });
    const groups = Object.values(cells).map(g => {
      const n = g.reduce((a, s) => a + shown(s).length, 0), cities = {};
      g.forEach(s => shown(s).forEach(b => { const c = b.city.replace(/,\s*[A-Z]{2}$/, ''); cities[c] = (cities[c] || 0) + 1; }));
      const name = Object.keys(cities).sort((a, b) => cities[b] - cities[a])[0];
      const lat = g.reduce((a, s) => a + s.lat, 0) / g.length, lon = g.reduce((a, s) => a + s.lon, 0) / g.length;
      return { name, n, lat, lon, g };
    }).sort((a, b) => b.n - a.n);
    const metro = VIEWS.find(v => v.key === 'metro'), stc = VIEWS.find(v => v.key === 'stcloud');
    const inMetro = g => !metro || inView(metro, g), stops = [], used = new Set();
    groups.filter(inMetro).forEach(g => { if (stops.length < 5 && !used.has(g.name)) { stops.push(g); used.add(g.name); } });
    const sc = stc && groups.find(g => inView(stc, g)); if (sc) stops.push(Object.assign({}, sc, { name: 'St. Cloud', n: ALL.filter(b => opOn.has(b.operator) && matchQ(b) && inView(stc, b)).length, view: 'stcloud' }));
    return stops;
  }
  let touring = false, tourId = 0;
  const caption = document.getElementById('caption');
  function showCaption(k, t, s) { document.getElementById('capK').textContent = k; document.getElementById('capT').textContent = t; document.getElementById('capS').textContent = s; caption.classList.add('on'); }
  function hideCaption() { caption.classList.remove('on'); }
  const fly = opts => new Promise(r => { map.once('moveend', r); map.flyTo(Object.assign({ essential: true }, opts)); });
  async function startTour() {
    const id = ++tourId; touring = true; stopOrbit(); popup.remove(); document.body.classList.add('touring');
    if (narrow()) togglePanel(false);
    if (!dim3d) { dim3d = true; paintControls(); if (map.getLayer('building-3d')) map.setLayoutProperty('building-3d', 'visibility', 'visible'); }
    const stops = tourStops(), total = stops.length;
    for (let i = 0; i < total && id === tourId; i++) {
      const s = stops[i]; hideCaption();
      if (s.view) { const v = VIEWS.find(x => x.key === s.view), cam = cameraFor(ALL.filter(b => inView(v, b))); await fly(Object.assign(cam, { duration: 4200, curve: 1.4 })); }
      else await fly({ center: [s.lon, s.lat], zoom: narrow() ? 11.6 : 12.4, pitch: narrow() ? 55 : 62, bearing: -40 + i * 28, duration: 4000, curve: 1.4 });
      if (id !== tourId) break;
      showCaption(`Stop ${i + 1} of ${total}`, s.name, `${fmt(s.n)} digital billboard${s.n === 1 ? '' : 's'}`);
      const until = performance.now() + 4200;                       // a slow drift while the caption is up
      while (performance.now() < until && id === tourId) { map.setBearing(map.getBearing() + 0.08); await sleep(16); }
    }
    if (id === tourId) { hideCaption(); setView('all'); showCaption('Saint Paul Agency', `${fmt(totals.nb)} digital billboards`, SUB); await sleep(4500); }
    if (id === tourId) stopTour();
  }
  function stopTour() { if (!touring) return; tourId++; touring = false; hideCaption(); document.body.classList.remove('touring'); map.stop(); if (presenting()) startOrbit(); }
  document.getElementById('tour').addEventListener('click', startTour);
  document.getElementById('stopTour').addEventListener('click', stopTour);

  // ---------- animation loop: orbit + keeping it smooth ----------
  function setQuality(q) {
    quality = q; store.set('spa3dQ', q);
    document.body.classList.toggle('lite', q < 2);
    if (map.setPixelRatio) map.setPixelRatio(PIXELS[q]);
    if (q === 0 && map.getLayer('motorway-glow')) map.setLayoutProperty('motorway-glow', 'visibility', 'none');
  }
  let lastFrame = performance.now(), fpsT0 = lastFrame, fpsN = 0, slow = 0;
  (function loop(now) {
    fpsN++;
    if (now - fpsT0 > 2500) {                        // every 2.5 s: if two checks in a row run under ~25 frames a second, step down
      const fps = fpsN * 1000 / (now - fpsT0); fpsT0 = now; fpsN = 0;
      if (started && !document.body.classList.contains('intro') && !document.hidden) { slow = fps < 25 ? slow + 1 : 0; if (slow >= 2 && quality > 0) { slow = 0; setQuality(quality - 1); } }
    }
    const dt = Math.min(100, now - lastFrame); lastFrame = now;
    if (orbiting && !map.isMoving()) map.setBearing(map.getBearing() + dt * 0.0025);   // about 2.5° a second, the same on any screen
    requestAnimationFrame(loop);
  })(performance.now());

  // ---------- intro: a turning globe, then down into the Twin Cities ----------
  paintControls();
  const hash = location.hash.slice(1), startView = VIEWS.some(v => v.key === hash) ? hash : VIEWS[0].key;
  function begin(how) {
    if (started) return; started = true;
    document.body.classList.remove('intro');
    refresh(); setView(startView, how); countUp();
  }
  document.getElementById('skip').addEventListener('click', () => { introDone = true; map.stop(); begin('fly-fast'); });
  let introDone = false, introStarted = false;
  // start when the first view has drawn, or a few seconds after the map is ready on a slow connection
  map.once('style.load', () => { loaded = true; statusEl.hidden = true; setTimeout(intro, 4000); });
  map.on('load', intro);
  async function intro() {
    if (introStarted) return; introStarted = true;
    loaded = true; statusEl.hidden = true; addOverlays();
    if (calm) { begin('jump'); return; }
    // spin the globe toward Minnesota
    const t1 = performance.now(), from = map.getCenter();
    while (!introDone && performance.now() - t1 < 2600) { const k = (performance.now() - t1) / 2600, e = k * k * (3 - 2 * k);
      map.jumpTo({ center: [from.lng + (-93.3 - from.lng) * e, from.lat + (45 - from.lat) * e] }); await sleep(16); }
    if (introDone) return;
    introDone = true;
    // billboards appear as the camera comes down
    started = true; refresh();
    document.body.classList.remove('intro');
    setView(startView, 'intro'); setTimeout(countUp, 1500);
  }
  window.__map = map;
})();
</script>
</body>
</html>
